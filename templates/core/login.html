{% extends 'core/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="bg-surface rounded-card shadow-card border border-border p-8 max-w-md mx-auto mt-16">
    <p class="text-center text-primary font-bold text-lg mb-1">Sistema de Gestão de Chamados</p>
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div class="flex flex-col gap-1">
                <label class="font-medium text-sm" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small class="text-danger">{{ field.errors|join:', ' }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-primary text-white font-semibold py-2 rounded-md hover:bg-primary-dark">Entrar</button>
    </form>
</div>
{% endblock %}
